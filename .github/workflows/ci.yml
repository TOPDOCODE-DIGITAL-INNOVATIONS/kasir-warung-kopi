name: CI

on:
  pull_request:
  push:
    branches: [main, development]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kasir:
    name: Aplikasi kasir
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app-kasir
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-kasir/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  dashboard:
    name: Dashboard & API sync
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: admin-dashboard
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # Placeholder: build tidak menghubungi Supabase. Rahasia asli hanya ada di Vercel.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-dashboard/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit & integration tests
        run: node --test tests/*.test.mjs
      - name: Build
        run: npm run build

  database:
    name: Migrasi & SQL tests (Supabase lokal)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Supabase CLI (versi terkunci di package-lock.json)
        run: npm ci
      - name: Start Postgres and apply every migration from scratch
        run: npx supabase db start
      - name: Install psql
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: SQL tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: node scripts/db.mjs test --local
      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup
